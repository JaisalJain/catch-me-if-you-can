# mujoco_ros2_control plugins (loaded into the ros2_control_node).
/**:
  ros__parameters:
    mujoco_plugins:
      free_joint_state_publisher:
        type: "mujoco_ros2_control_plugins/FreeJointStatePublisherPlugin"
      mujoco_camera_plugin:            # key name is hard-coded in the plugin (0.1.1)
        type: "mujoco_ros2_control_plugins/CameraPlugin"
        camera_publish_rate: 10.0      # one rate for all cameras in 0.1.1
        overhead_a: {frame_name: overhead_a_optical, info_topic: /cameras/overhead_a/camera_info, image_topic: /cameras/overhead_a/image_raw, depth_topic: /cameras/overhead_a/depth}
        overhead_b: {frame_name: overhead_b_optical, info_topic: /cameras/overhead_b/camera_info, image_topic: /cameras/overhead_b/image_raw, depth_topic: /cameras/overhead_b/depth}
        side: {frame_name: side_optical, info_topic: /cameras/side/camera_info, image_topic: /cameras/side/image_raw, depth_topic: /cameras/side/depth}
        demo: {policy: disabled}
        b_robotiq_wrist_cam: {frame_name: b_wrist_cam_optical, info_topic: /cameras/b_wrist/camera_info, image_topic: /cameras/b_wrist/image_raw, depth_topic: /cameras/b_wrist/depth}

# 0.1.1 bug (fixed upstream in 0.1.2, ros-controls/mujoco_ros2_control#291): FreeJointStatePublisherPlugin reads
# its parameters un-prefixed from the mujoco node.
mujoco_ros2_control_node:
  ros__parameters:
    publish_rate: 200.0
    frame_id: ""
    body_names: [cube_red, cube_green, cube_blue]
