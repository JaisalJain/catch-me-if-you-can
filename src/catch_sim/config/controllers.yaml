# ros2_control controllers for the MuJoCo sim (loaded by catch_sim/launch/sim.launch.py).
controller_manager:
  ros__parameters:
    update_rate: 500  # Hz of sim time

joint_state_broadcaster:
  ros__parameters:
    type: joint_state_broadcaster/JointStateBroadcaster

arm_a_controller:
  ros__parameters:
    type: joint_trajectory_controller/JointTrajectoryController
    joints: [a_shoulder_pan_joint, a_shoulder_lift_joint, a_elbow_joint, a_wrist_1_joint, a_wrist_2_joint, a_wrist_3_joint]
    command_interfaces: [effort]
    state_interfaces: [position, velocity]
    interpolation_method: splines
    allow_nonzero_velocity_at_trajectory_end: false
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 0.5
      a_shoulder_pan_joint: {trajectory: 0.0, goal: 0.02}
      a_shoulder_lift_joint: {trajectory: 0.0, goal: 0.02}
      a_elbow_joint: {trajectory: 0.0, goal: 0.02}
      a_wrist_1_joint: {trajectory: 0.0, goal: 0.02}
      a_wrist_2_joint: {trajectory: 0.0, goal: 0.02}
      a_wrist_3_joint: {trajectory: 0.0, goal: 0.02}
    gains:
      a_shoulder_pan_joint: {p: 6000.0, d: 250.0, i: 0.0, i_clamp: 0.0, ff_velocity_scale: 0.0}
      a_shoulder_lift_joint: {p: 6000.0, d: 250.0, i: 0.0, i_clamp: 0.0, ff_velocity_scale: 0.0}
      a_elbow_joint: {p: 3000.0, d: 100.0, i: 0.0, i_clamp: 0.0, ff_velocity_scale: 0.0}
      a_wrist_1_joint: {p: 600.0, d: 20.0, i: 0.0, i_clamp: 0.0, ff_velocity_scale: 0.0}
      a_wrist_2_joint: {p: 600.0, d: 20.0, i: 0.0, i_clamp: 0.0, ff_velocity_scale: 0.0}
      a_wrist_3_joint: {p: 300.0, d: 10.0, i: 0.0, i_clamp: 0.0, ff_velocity_scale: 0.0}

gripper_a_controller:
  ros__parameters:
    type: position_controllers/GripperActionController
    joint: a_robotiq_85_left_knuckle_joint
    goal_tolerance: 0.02
    allow_stalling: true
    stall_velocity_threshold: 0.01
    stall_timeout: 0.3

