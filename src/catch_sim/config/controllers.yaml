      b_shoulder_pan_joint: {trajectory: 0.0, goal: 0.02}
      b_shoulder_lift_joint: {trajectory: 0.0, goal: 0.02}
      b_elbow_joint: {trajectory: 0.0, goal: 0.02}
      b_wrist_1_joint: {trajectory: 0.0, goal: 0.02}
      b_wrist_2_joint: {trajectory: 0.0, goal: 0.02}
      b_wrist_3_joint: {trajectory: 0.0, goal: 0.02}
    gains:
      b_shoulder_pan_joint: {p: 6000.0, d: 250.0, i: 0.0, i_clamp: 0.0, ff_velocity_scale: 0.0}
      b_shoulder_lift_joint: {p: 6000.0, d: 250.0, i: 0.0, i_clamp: 0.0, ff_velocity_scale: 0.0}
      b_elbow_joint: {p: 3000.0, d: 100.0, i: 0.0, i_clamp: 0.0, ff_velocity_scale: 0.0}
      b_wrist_1_joint: {p: 600.0, d: 20.0, i: 0.0, i_clamp: 0.0, ff_velocity_scale: 0.0}
      b_wrist_2_joint: {p: 600.0, d: 20.0, i: 0.0, i_clamp: 0.0, ff_velocity_scale: 0.0}
      b_wrist_3_joint: {p: 300.0, d: 10.0, i: 0.0, i_clamp: 0.0, ff_velocity_scale: 0.0}

gripper_b_controller:
