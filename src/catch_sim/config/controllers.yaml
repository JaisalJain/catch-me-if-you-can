# ros2_control controllers for the MuJoCo sim (loaded by catch_sim/launch/sim.launch.py).
controller_manager:
  ros__parameters:
    update_rate: 500  # Hz of sim time

joint_state_broadcaster:
  ros__parameters:
    type: joint_state_broadcaster/JointStateBroadcaster

b_palm_ft_broadcaster:          # B's palm contact force (catch trigger), published every control cycle
  ros__parameters:
    type: force_torque_sensor_broadcaster/ForceTorqueSensorBroadcaster
    sensor_name: b_palm_ft
    frame_id: b_palm_insert

arm_a_controller:
  ros__parameters:
    type: joint_trajectory_controller/JointTrajectoryController
    joints: [a_shoulder_pan_joint, a_shoulder_lift_joint, a_elbow_joint, a_wrist_1_joint, a_wrist_2_joint, a_wrist_3_joint]
    command_interfaces: [effort]
    state_interfaces: [position, velocity]
    interpolation_method: splines
    allow_nonzero_velocity_at_trajectory_end: false
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 0.5
      a_shoulder_pan_joint: {trajectory: 0.0, goal: 0.02}
      a_shoulder_lift_joint: {trajectory: 0.0, goal: 0.02}
      a_elbow_joint: {trajectory: 0.0, goal: 0.02}
      a_wrist_1_joint: {trajectory: 0.0, goal: 0.02}
      a_wrist_2_joint: {trajectory: 0.0, goal: 0.02}
      a_wrist_3_joint: {trajectory: 0.0, goal: 0.02}
    gains:
      a_shoulder_pan_joint: {p: 6000.0, d: 250.0, i: 0.0, i_clamp: 0.0, ff_velocity_scale: 0.0}
      a_shoulder_lift_joint: {p: 6000.0, d: 250.0, i: 0.0, i_clamp: 0.0, ff_velocity_scale: 0.0}
      a_elbow_joint: {p: 3000.0, d: 100.0, i: 0.0, i_clamp: 0.0, ff_velocity_scale: 0.0}
      a_wrist_1_joint: {p: 600.0, d: 20.0, i: 0.0, i_clamp: 0.0, ff_velocity_scale: 0.0}
      a_wrist_2_joint: {p: 600.0, d: 20.0, i: 0.0, i_clamp: 0.0, ff_velocity_scale: 0.0}
      a_wrist_3_joint: {p: 300.0, d: 10.0, i: 0.0, i_clamp: 0.0, ff_velocity_scale: 0.0}

gripper_a_controller:            # a JTC (not a GripperActionController): the throw schedules the grip loosen as a
  ros__parameters:                # time-stamped trajectory, executed by the 500 Hz control loop in sim time (M5)
    type: joint_trajectory_controller/JointTrajectoryController
    joints: [a_robotiq_85_left_knuckle_joint]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    interpolation_method: splines
    interpolate_from_desired_state: true     # start from the last command (0.70 while gripping), not the stalled state
    allow_nonzero_velocity_at_trajectory_end: true
    constraints:                             # 0 = not checked: the fingers stall on a cube short of the command
      stopped_velocity_tolerance: 0.0
      goal_time: 0.0
      a_robotiq_85_left_knuckle_joint: {trajectory: 0.0, goal: 0.0}

arm_b_controller:
  ros__parameters:
    type: joint_trajectory_controller/JointTrajectoryController
    joints: [b_shoulder_pan_joint, b_shoulder_lift_joint, b_elbow_joint, b_wrist_1_joint, b_wrist_2_joint, b_wrist_3_joint]
    command_interfaces: [effort]
    state_interfaces: [position, velocity]
    interpolation_method: splines
    interpolate_from_desired_state: true     # v2: the reactive catcher replaces trajectories at up to 50 Hz;
                                             # continue from the last command, not the measured state
    allow_nonzero_velocity_at_trajectory_end: false
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 0.5
      b_shoulder_pan_joint: {trajectory: 0.0, goal: 0.02}
      b_shoulder_lift_joint: {trajectory: 0.0, goal: 0.02}
      b_elbow_joint: {trajectory: 0.0, goal: 0.02}
      b_wrist_1_joint: {trajectory: 0.0, goal: 0.02}
      b_wrist_2_joint: {trajectory: 0.0, goal: 0.02}
      b_wrist_3_joint: {trajectory: 0.0, goal: 0.02}
    gains:
      b_shoulder_pan_joint: {p: 6000.0, d: 250.0, i: 0.0, i_clamp: 0.0, ff_velocity_scale: 0.0}
      b_shoulder_lift_joint: {p: 6000.0, d: 250.0, i: 0.0, i_clamp: 0.0, ff_velocity_scale: 0.0}
      b_elbow_joint: {p: 3000.0, d: 100.0, i: 0.0, i_clamp: 0.0, ff_velocity_scale: 0.0}
      b_wrist_1_joint: {p: 600.0, d: 20.0, i: 0.0, i_clamp: 0.0, ff_velocity_scale: 0.0}
      b_wrist_2_joint: {p: 600.0, d: 20.0, i: 0.0, i_clamp: 0.0, ff_velocity_scale: 0.0}
      b_wrist_3_joint: {p: 300.0, d: 10.0, i: 0.0, i_clamp: 0.0, ff_velocity_scale: 0.0}

gripper_b_controller:            # a JTC like gripper A (v2): every command is a rate-limited, delayed ramp
  ros__parameters:                # (catch_sim/gripper_model.py, 2F-85 speed and command latency), executed in sim time
    type: joint_trajectory_controller/JointTrajectoryController
    joints: [b_robotiq_85_left_knuckle_joint]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    interpolation_method: splines
    interpolate_from_desired_state: true
    allow_nonzero_velocity_at_trajectory_end: true
    constraints:
      stopped_velocity_tolerance: 0.0
      goal_time: 0.0
      b_robotiq_85_left_knuckle_joint: {trajectory: 0.0, goal: 0.0}
