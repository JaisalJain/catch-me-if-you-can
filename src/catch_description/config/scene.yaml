# Single source of truth for scene geometry. Read by scripts/build_mjcf.py (MJCF) and urdf/scene.urdf.xacro.
# World frame: table centre on the floor projection, x from A to B, z up. Units: m, rad.
table:
  size: [2.0, 0.8]          # x, y
  top_z: 0.75
  top_thickness: 0.04
  leg_size: 0.06
robots:                     # base z = table top + pedestal_height (pedestal = primitive box on the table)
  pedestal_size: 0.18
  a: {base_xy: [-0.80, 0.0], base_yaw: 0.0, pedestal_height: 0.35}
  b: {base_xy: [0.80, 0.0], base_yaw: 3.141592653589793, pedestal_height: 0.35}
gripper:
  mount_offset: 0.0108      # tool0 -> robotiq base origin along tool z (Menagerie base_mount 0.007 + 0.0038)
  palm_insert:              # primitive palm insert in the robotiq base frame; collides with cubes only
    half_size: [0.020, 0.006, 0.015]   # x (finger-plate width dir), y (opening dir), z. 12 mm wide: the spring
                                       # links stay > 1 mm away up to driver angle 0.71 (we never command > 0.70)
    top_z: 0.110
cube:
  edge: 0.040
  mass: 0.060
  colors:
    red: [0.85, 0.10, 0.10, 1.0]
    green: [0.10, 0.70, 0.15, 1.0]
    blue: [0.10, 0.25, 0.85, 1.0]
pallets:
  slot_order: [red, green, blue]
  slot_pitch: 0.09           # centre-to-centre along x
  slot_inner: 0.052          # inner square size of a slot (cube 40 mm -> 6 mm clearance)
  border_width: 0.008
  border_height: 0.006
  base_size: [0.30, 0.10, 0.012]
  a: {center: [-0.45, -0.28]}   # 0.35 m in front of the base (reach margin >= 0.72 rad, tools/pick_geometry.py)
  b: {center: [0.45, -0.28]}
lighting:                   # visual only (no effect on physics)
  headlight_ambient: 0.12
  headlight_diffuse: 0.25
  key: 0.45
  fill: 0.18
  top: 0.20
cameras:
  overhead_a: {pos: [-0.45, -0.28, 1.45], fovy: 32, resolution: [640, 480]}
  overhead_b: {pos: [0.45, -0.28, 1.45], fovy: 32, resolution: [640, 480]}
  side: {pos: [0.0, -1.7, 1.05], target: [0.0, 0.0, 1.05], fovy: 50, resolution: [640, 480]}
  b_wrist: {pos_in_gripper_base: [0.0, 0.12, 0.15], fovy: 60, resolution: [320, 240]}
  # v2 flight tracking (catch_tracker): two fixed cameras with orthogonal views of the flight volume (v2 Phase 1:
  # a pair facing each other leaves depth badly conditioned). MuJoCo look-at: camera looks at `target`, image up =
  # world z (or `up` when looking straight down).
  tracking:
    track_side: {pos: [0.15, -1.30, 1.30], target: [0.15, 0.20, 1.25], fovy: 45, resolution: [320, 240]}
    track_top:  {pos: [0.15, 0.20, 2.35], target: [0.15, 0.20, 1.25], up: [0.0, 1.0, 0.0], fovy: 55, resolution: [320, 240]}
  # B's wrist camera hardware (visual; MoveIt collision = each part 1 mm larger; the capsule model covers it): a
  # generic small stereo depth camera, 42 x 42 x 23 mm, on a compact wrist mount (clamp collar on the gripper base,
  # 20 x 20 mm extrusion arm under the finger linkages - lowest finger point on that side z = 0.045, outermost |y| =
  # 0.074 over the stroke - and an upright behind the camera with a tilt block). The optical frame (b_wrist above)
  # is unchanged. frame camera: optical frame (origin = optical centre, on the front face; z = view direction,
  # x right, y down; every camera part lies behind z = 0, out of its own view); frame base: Menagerie gripper base
  # frame. box: size = full edges; cylinder: [radius, length] along `axis`.
  b_wrist_camera_parts:
    - {name: body,    frame: camera, type: box,      size: [0.042, 0.042, 0.023], pos: [0.0, 0.0, -0.0125], rgba: [0.17, 0.18, 0.20, 1]}
    - {name: glass,   frame: camera, type: box,      size: [0.036, 0.018, 0.0008], pos: [0.0, 0.0, -0.0008], rgba: [0.02, 0.02, 0.03, 1]}
    - {name: lens_l,  frame: camera, type: cylinder, size: [0.0042, 0.0010], axis: z, pos: [-0.009, 0.0, -0.0007], rgba: [0.10, 0.14, 0.24, 1]}
    - {name: lens_r,  frame: camera, type: cylinder, size: [0.0042, 0.0010], axis: z, pos: [0.009, 0.0, -0.0007], rgba: [0.10, 0.14, 0.24, 1]}
    - {name: emitter, frame: camera, type: cylinder, size: [0.0020, 0.0010], axis: z, pos: [0.0, 0.0, -0.0007], rgba: [0.06, 0.06, 0.07, 1]}
    - {name: cable,   frame: camera, type: cylinder, size: [0.0028, 0.012], axis: x, pos: [0.027, 0.004, -0.013], rgba: [0.05, 0.05, 0.05, 1]}
    - {name: tilt_block, frame: camera, type: box,   size: [0.026, 0.026, 0.006], pos: [0.0, 0.0, -0.027], rgba: [0.46, 0.48, 0.51, 1]}
    - {name: collar,  frame: base,   type: cylinder, size: [0.0435, 0.016], axis: z, pos: [0.0, 0.0, 0.020], rgba: [0.22, 0.23, 0.25, 1]}
    - {name: lug,     frame: base,   type: box,      size: [0.028, 0.016, 0.020], pos: [0.0, 0.046, 0.020], rgba: [0.22, 0.23, 0.25, 1]}
    - {name: arm,     frame: base,   type: box,      size: [0.020, 0.112, 0.020], pos: [0.0, 0.106, 0.020], rgba: [0.46, 0.48, 0.51, 1]}
    - {name: upright, frame: base,   type: box,      size: [0.020, 0.016, 0.134], pos: [0.0, 0.154, 0.097], rgba: [0.46, 0.48, 0.51, 1]}
    - {name: knob,    frame: base,   type: cylinder, size: [0.0065, 0.030], axis: x, pos: [0.0, 0.154, 0.154], rgba: [0.22, 0.23, 0.25, 1]}
