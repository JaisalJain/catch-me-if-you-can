# MuJoCo physics / contact parameters (read by scripts/build_mjcf.py). Tuned in M2.
timestep: 0.001
integrator: implicitfast
cone: elliptic
impratio: 10
cube:
  friction: [0.9, 0.01, 0.001]
  condim: 4
  solref: [0.004, 1.0]
  solimp: [0.95, 0.99, 0.001, 0.5, 2.0]
pads:                       # Menagerie 2F-85 pad boxes (defaults 0.7/0.6)
  friction: [1.0, 0.01, 0.001]
palm_insert:
  friction: [0.9, 0.01, 0.001]
  solref: [0.004, 1.0]
  solimp: [0.95, 0.99, 0.001, 0.5, 2.0]
table:
  friction: [0.6, 0.005, 0.0001]
arm:
  gravcomp: true
gripper:                    # 2F-85 driver servo (rad). v1: kp 100 (fingers reached ~720 mm/s on a step command,
  kp: 1000.0                # 3-5x the real 2F-85). v2: kp x10 so the fingers track the rate-limited, delayed
  kv: 10.0                  # reference of catch_sim/gripper_model.py (150 mm/s, 10 ms); force limit unchanged
  force_scale: 1.0          # (same grip force as v1). Benchmark variants: tools/v2_live/mjcf_variant.py
